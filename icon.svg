<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="75%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="100%" stop-color="#08080f"/>
    </radialGradient>
    <radialGradient id="glow" cx="256" cy="90" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Purple ambient glow from spotlight -->
  <ellipse cx="256" cy="90" rx="230" ry="230" fill="url(#glow)"/>

  <!-- Spotlight beam (wide cone) -->
  <path d="M 256 108 L 42 498 L 470 498 Z" fill="#7c3aed" opacity="0.13"/>
  <!-- Inner brighter beam -->
  <path d="M 256 108 L 148 498 L 364 498 Z" fill="#a78bfa" opacity="0.11"/>

  <!-- Spotlight housing -->
  <ellipse cx="256" cy="82" rx="46" ry="20" fill="#3b1a78"/>
  <!-- Spotlight lens outer -->
  <circle cx="256" cy="88" r="44" fill="#5b21b6"/>
  <!-- Spotlight lens mid -->
  <circle cx="256" cy="88" r="30" fill="#7c3aed"/>
  <!-- Spotlight lens inner glow -->
  <circle cx="256" cy="88" r="17" fill="#c4b5fd"/>
  <!-- Spotlight lens center -->
  <circle cx="256" cy="88" r="7" fill="white"/>

  <!-- "AJ" monogram -->
  <text x="256" y="400"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="218" font-weight="900" text-anchor="middle"
        fill="white" opacity="0.95" letter-spacing="-10">AJ</text>

  <!-- Green accent dot (top-right) -->
  <circle cx="375" cy="148" r="18" fill="#4ade80" opacity="0.85"/>
</svg>
