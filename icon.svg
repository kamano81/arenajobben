<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0820"/>
      <stop offset="100%" stop-color="#04040a"/>
    </radialGradient>
    <radialGradient id="dome-sheen" cx="38%" cy="28%" r="55%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e8e4f4"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </radialGradient>
    <radialGradient id="green-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle purple glow behind dome -->
  <ellipse cx="256" cy="310" rx="210" ry="90" fill="#7c3aed" opacity="0.08"/>

  <!-- Foundation / base platform -->
  <rect x="88" y="356" width="336" height="30" rx="6" fill="url(#dome-sheen)" opacity="0.92"/>

  <!-- Dome (half-circle) -->
  <path d="M 88 358 A 168 168 0 0 1 424 358 Z" fill="url(#dome-sheen)"/>

  <!-- Inner dome highlight (subtle second tone) -->
  <path d="M 138 358 A 118 118 0 0 1 374 358 Z" fill="#a78bfa" opacity="0.14"/>

  <!-- Subtle latitude line suggesting sphere -->
  <path d="M 100 330 A 160 50 0 0 1 412 330" fill="none" stroke="white" stroke-width="1.5" opacity="0.12"/>
  <path d="M 115 300 A 145 38 0 0 1 397 300" fill="none" stroke="white" stroke-width="1.2" opacity="0.08"/>

  <!-- Green apex dot (arena light / top of globe) -->
  <ellipse cx="256" cy="193" rx="22" ry="22" fill="url(#green-glow)"/>
  <circle cx="256" cy="193" r="11" fill="#4ade80"/>
  <circle cx="256" cy="193" r="5" fill="#d1fae5"/>
</svg>
